# -- Site Configuration --
baseURL = "https://haussknecht.com/"
defaultContentLanguage = "de"

enableRobotsTXT = true
summaryLength = 0

buildDrafts = false
buildFuture = false

disableKinds = ["taxonomy", "term"]

[pagination]
  pagerSize = 100

[outputs]
  home = ["HTML", "RSS"]

[sitemap]
  changefreq = 'daily'
  filename = 'sitemap.xml'
  priority = 0.5
