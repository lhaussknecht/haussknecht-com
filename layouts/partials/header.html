<header class="site-header">
  <div class="container">
    <a class="site-brand" href="{{ site.Home.RelPermalink }}">
      <img src="/img/haussknecht-wappen-weiss.svg" alt="" width="33" height="64">
      <span class="name">Haußknecht IT-Consulting</span>
    </a>
    <nav class="site-nav">
      {{ $current := . }}
      {{ range site.Menus.main }}
      <a href="{{ .URL }}" {{ if or ($current.IsMenuCurrent "main" .) ($current.HasMenuCurrent "main" .) }}aria-current="true"{{ end }}>{{ .Name }}</a>
      {{ end }}
    </nav>
  </div>
</header>
